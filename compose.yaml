services:
  app:
    build: .
    restart: on-failure
    env_file:
      - .env
    environment:
      MYSQL_DSN: "root:root@tcp(mysql:3306)/boiler?charset=utf8mb4&parseTime=True&loc=Local"
      REDIS_ADDR: "redis:6379"
    ports:
      - "9090:9090"
    depends_on:
      - mysql
      - redis

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: boiler
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine

volumes:
  mysql_data: